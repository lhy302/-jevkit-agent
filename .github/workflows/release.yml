name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install PyInstaller
      run: |
        python -m pip install --upgrade pip
        python -m pip install pyinstaller

    - name: Run Quality Checks
      run: |
        python jevkit-agent/dev/check-constants.py jevkit-agent/dev/jevkit-agent.py
        cd jevkit-agent
        python dev/jevkit-agent.py --selftest

    - name: Build Standalone Executable
      run: |
        cd jevkit-agent/dev
        python -m PyInstaller --noconfirm --clean --distpath ../dist --workpath ../build jevkit-agent.spec

    - name: Package Release Assets
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path release-pkg
        Copy-Item jevkit-agent\dist\jevkit-agent.exe release-pkg\
        Copy-Item -Recurse jevkit-agent\tables release-pkg\
        Copy-Item jevkit-agent\dev\jevkit-agent.config.example.json release-pkg\jevkit-agent.config.json
        Copy-Item jevkit-agent\操作指南.txt release-pkg\
        Copy-Item jevkit-agent\README.md release-pkg\
        Copy-Item LICENSE release-pkg\

        # 创建启动脚本
        @"
        @echo off
        start "" "%~dp0jevkit-agent.exe"
        "@ | Out-File -FilePath release-pkg\启动.bat -Encoding ascii

        Compress-Archive -Path release-pkg\* -DestinationPath jevkit-agent-windows-x64.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: jevkit-agent-windows-x64.zip
        generate_release_notes: true
