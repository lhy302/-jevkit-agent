name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      PYTHONIOENCODING: "utf-8"

    defaults:
      run:
        shell: pwsh

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run Constants Static Check
      run: |
        python jevkit-agent/dev/check-constants.py jevkit-agent/dev/jevkit-agent.py

    - name: Run DSL Literal Regression Tests
      run: python jevkit-agent/dev/test-dsl-literals.py

    - name: Run Full Offline Selftest (125 tests)
      working-directory: ./jevkit-agent
      run: |
        python dev/jevkit-agent.py --selftest

    - name: Run Rollback Regression Tests
      run: python jevkit-agent/dev/test-rollback.py
